<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preparation Notes</title>
    <meta
      name="description"
      content="Interview preparation notes on DBMS, SQL and Git."
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #24292f;
        --muted: #57606a;
        --border: #d0d7de;
        --card: #f6f8fa;
        --accent: #0969da;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --fg: #e6edf3;
          --muted: #9198a1;
          --border: #30363d;
          --card: #161b22;
          --accent: #4493f8;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 48px 20px 80px;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 860px;
        margin: 0 auto;
      }
      h1 {
        font-size: 2.2rem;
        margin: 0 0 8px;
      }
      .tagline {
        color: var(--muted);
        margin: 0 0 40px;
      }
      .section {
        margin: 0 0 40px;
      }
      .section > h2 {
        font-size: 1.35rem;
        margin: 0 0 16px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }
      .subsection {
        margin: 24px 0 0;
      }
      .subsection > h3 {
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 0 0 12px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
        padding: 0;
        margin: 0;
        list-style: none;
      }
      .card {
        display: block;
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card);
        text-decoration: none;
        color: inherit;
        transition:
          border-color 0.15s ease,
          transform 0.15s ease;
      }
      .card:hover,
      .card:focus-visible {
        border-color: var(--accent);
        transform: translateY(-2px);
      }
      .card .card-title {
        display: block;
        margin: 0 0 6px;
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--accent);
      }
      .card p {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
      }
      footer {
        max-width: 860px;
        margin: 56px auto 0;
        padding-top: 20px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.88rem;
      }
      footer a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Preparation Notes</h1>
      <p class="tagline">
        Study notes rendered from Markdown. Pick a topic to start reading.
      </p>
      <div id="notes"></div>
    </main>
    <footer>
      Source on
      <a href="https://github.com/ft-abhishekgupta/preparation-notes">GitHub</a
      >.
    </footer>

                }
              ]
            }
          ]
        }
      ];
      /* END GENERATED NOTES */

      function createCardList(notes) {
        const list = document.createElement("ul");
        list.className = "cards";

        for (const note of notes) {
          const item = document.createElement("li");
          const link = document.createElement("a");
          link.className = "card";
          link.href = note.href;

          const heading = document.createElement("span");
          heading.className = "card-title";
          heading.textContent = note.title;

          const description = document.createElement("p");
          description.textContent = note.description;

          link.append(heading, description);
          item.append(link);
          list.append(item);
        }

        return list;
      }

      const container = document.getElementById("notes");
      for (const section of sections) {
        const wrapper = document.createElement("section");
        wrapper.className = "section";

        const heading = document.createElement("h2");
        heading.textContent = section.title;
        wrapper.append(heading);

        if (section.notes?.length) {
          wrapper.append(createCardList(section.notes));
        }

        for (const subsection of section.subsections ?? []) {
          const subWrapper = document.createElement("div");
          subWrapper.className = "subsection";

          const subHeading = document.createElement("h3");
          subHeading.textContent = subsection.title;

          subWrapper.append(subHeading, createCardList(subsection.notes));
          wrapper.append(subWrapper);
        }

        container.append(wrapper);
      }
    </script>
  </body>
</html>
